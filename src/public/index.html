<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Motion Presence demo</title><style>
:root{font:16px system-ui;color-scheme:light dark}body{max-width:42rem;margin:3rem auto;padding:1rem}button,a{min-height:44px;padding:.7rem;margin:.25rem}#panel{border:2px solid;padding:1.25rem;border-radius:12px}.choices{display:flex;flex-wrap:wrap;gap:.5rem}.target{width:12rem;height:12rem;border:2px solid;margin:1rem auto;position:relative}.dot{position:absolute;left:calc(50% - 12px);top:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:CanvasText}.goal{position:absolute;width:34px;height:34px;border:3px dashed currentColor;border-radius:4px;transform:translate(-50%,-50%)}:focus-visible{outline:3px solid Highlight}@media(prefers-reduced-motion:no-preference){.dot{transition:transform .08s linear}}
</style></head><body><main><h1>Demo merchant</h1><p>A purchase stays pending until the merchant server consumes a verification result.</p><button id="buy">Purchase demo item</button><section id="panel" hidden aria-live="polite"></section></main><script type="module" src="/app.js"></script></body></html>
